   let weighted=lines.some(x=>x.weight!==null&&x.weight>0);
   let maxKg=weighted?Math.max(...lines.map(x=>x.weight||0)):null;
   let totalReps=lines.reduce((a,x)=>a+x.reps,0);
   let topReps=Math.max(...lines.map(x=>x.reps));
   let volume=lines.reduce((a,x)=>a+x.reps*(x.weight||0),0);

function fmt(v,digits=1){return Number(v).toLocaleString('de-AT',{maximumFractionDigits:digits})}

function progress(){
 let done=0,k=0;for(let i=0;i<total;i++){if(entry(i).complete){if(dayType(i)==='K')k++;if(['A','B'].includes(dayType(i)))done++}}
 let tracked=Object.entries(catalog).map(([id,x])=>({id,x,h:loggedHistory(id)})).filter(o=>o.h.length).sort((a,b)=>b.h.at(-1).date.localeCompare(a.h.at(-1).date));
 let exerciseRows=tracked.length?tracked.map(({id,x,h})=>{let last=h.at(-1);return `<button class="exercise-progress-row" data-open-history="${id}"><div><b>${esc(x.name)}</b><span>${h.length} dokumentierte ${h.length===1?'Einheit':'Einheiten'} · zuletzt ${new Date(last.date+'T12:00:00').toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'})}</span></div><div style="text-align:right"><b>${last.maxKg!==null?fmt(last.maxKg)+' kg':fmt(last.topReps)+' '+setMetric(id)}</b><span>Verlauf ansehen ›</span></div></button>`}).join(''):'<div class="history-empty">Noch keine Übungswerte gespeichert. Trage beim nächsten Training Wiederholungen ein, dann erscheint hier deine Übungshistorie.</div>';
 return heading('Fortschritt & Datensicherung','Dein Trainingsverlauf, Leistungswerte und private Backups.')+`<div class="card"><div class="summaryblocks"><div>Krafttraining<b>${done}/52</b></div><div>Kampfsport<b>${k}/26</b></div><div>Erfüllung<b>${Math.round(done/52*100)}%</b></div></div></div><section class="card section"><div class="section-label"><h2>Deine Übungen im Detail</h2><span class="meta">${tracked.length} erfasst</span></div><p class="small muted">Tippe eine Übung an, um Gewichte, Wiederholungen und deine Monatsentwicklung zu vergleichen.</p><div class="exercise-progress-list">${exerciseRows}</div>${!tracked.length?`<div style="margin-top:12px"><button class="btn alt" data-history-empty>Übung auswählen und Verlauf öffnen</button></div>`:''}</section><div class="card section"><h2>Datenschutz & Sicherung</h2><p class="hint">Deine Trainingsdaten bleiben im aktuellen Browser. Wenn du Website-Daten löschst, die App entfernst oder das Gerät wechselst, können sie verloren gehen. Exportiere deshalb regelmäßig eine JSON-Sicherung und bewahre sie sicher auf. Unverschlüsselte Sicherungen sind für Personen mit Dateizugriff lesbar.</p><div class="toolbar"><button class="btn" data-export>JSON sichern</button><button class="btn alt" data-csv>CSV exportieren</button></div><label>JSON-Sicherung importieren</label><input id="import" type="file" accept=".json,application/json"><p class="status">Speicherstatus: ${storageOK?'Lokaler Browser-Speicher verfügbar':'Lokales Speichern blockiert'}</p></div>`;
}
function download(name,type,text){let b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function wire(){document.querySelectorAll('[data-rem-enable]').forEach(b=>b.onchange=()=>{reminders[+b.dataset.remEnable].enabled=b.checked;saveReminders();render()});document.querySelectorAll('[data-rem-time]').forEach(b=>b.onchange=()=>{reminders[+b.dataset.remTime].time=b.value;saveReminders()});const remExport=document.querySelector('[data-rem-export]');if(remExport)remExport.onclick=reminderCalendar;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.index=+b.dataset.day;setView('training')});let p=document.querySelector('[data-prev]'),n=document.querySelector('[data-next]');if(p)p.onclick=()=>{state.index=Math.max(0,state.index-1);render()};if(n)n.onclick=()=>{state.index=Math.min(total-1,state.index+1);render()};let date=document.querySelector('#datepick');if(date)date.onchange=()=>{let v=idx(date.value);if(v>=0&&v<total){state.index=v;render()}};
document.querySelectorAll('[data-entry]').forEach(e=>e.onchange=()=>edit(state.index,{[e.dataset.entry]:e.value}));document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{edit(state.index,{complete:b.type==='checkbox'?b.checked:!entry(state.index).complete});render()});
document.querySelectorAll('[data-open-history]').forEach(b=>b.onclick=()=>openHistory(b.dataset.openHistory,state.view));let histBack=document.querySelector('[data-history-back]');if(histBack)histBack.onclick=()=>setView(state.historyFrom||'training');const histPick=document.querySelector('#history-pick');if(histPick)histPick.onchange=()=>{state.historyId=histPick.value;state.historyMetric='auto';render()};document.querySelectorAll('[data-hmetric]').forEach(b=>b.onclick=()=>{state.historyMetric=b.dataset.hmetric;render()});document.querySelectorAll('[data-history-day]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.historyDay);setView('training')});const histEmpty=document.querySelector('[data-history-empty]');if(histEmpty)histEmpty.onclick=()=>openHistory('squat','stats');
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [i,d]=b.dataset.move.split(':').map(Number),a=clone(list(state.index)),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];updatePlan(state.index,a);render()});
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));a.splice(+b.dataset.remove,1);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-variant]').forEach(e=>e.onchange=()=>{let a=clone(list(state.index));a[+e.dataset.variant].variant=e.value;updatePlan(state.index,a)});
document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));let ex=a[+b.dataset.addset];ex.sets.push(null);if(!Array.isArray(ex.weights))ex.weights=[];ex.weights.push(null);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.delset.split(':').map(Number),a=clone(list(state.index));if(a[i].sets.length<=1)return alert('Mindestens ein Satz bleibt erhalten.');a[i].sets.splice(j,1);if(Array.isArray(a[i].weights))a[i].weights.splice(j,1);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-set]').forEach(e=>e.onchange=()=>{let [i,j]=e.dataset.set.split(':').map(Number),a=clone(list(state.index));a[i].sets[j]=e.value===''?null:Number(e.value);updatePlan(state.index,a)});
document.querySelectorAll('[data-weight]').forEach(el=>el.onchange=()=>{let [i,j]=el.dataset.weight.split(':').map(Number),a=clone(list(state.index));if(!Array.isArray(a[i].weights))a[i].weights=[];const number=Number(el.value.replace(',','.'));a[i].weights[j]=el.value.trim()===''?null:(Number.isFinite(number)&&number>=0?number:null);updatePlan(state.index,a)});
let add=document.querySelector('[data-add]');if(add)add.onclick=()=>{state.adding=true;setView('body')};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));a.push({id:b.dataset.pick,variant:'standard',sets:[null,null]});updatePlan(state.index,a);state.adding=false;setView('training')});document.querySelectorAll('[data-muscle]').forEach(b=>{const act=()=>{state.muscle=b.dataset.muscle;setView('body')};b.onclick=act;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{sex=b.dataset.sex;save();render()});let back=document.querySelector('[data-back]');if(back)back.onclick=()=>{state.adding=false;setView('training')};
let prop=document.querySelector('[data-propagate]');if(prop)prop.onclick=()=>{let type=dayType(state.index),src=clone(list(state.index)).map(x=>({id:x.id,variant:x.variant,sets:x.sets.map(()=>null),weights:x.sets.map(()=>null)})),count=0;for(let z=state.index+1;z<total;z++)if(dayType(z)===type&&!plans[iso(z)]){plans[iso(z)]=clone(src);count++}save();alert(`${count} zukünftige Trainingstage aktualisiert.`)};
let dragging=null;document.querySelectorAll('[data-card]').forEach(c=>{c.ondragstart=e=>{dragging=+c.dataset.card;e.dataTransfer.effectAllowed='move'};c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();let dest=+c.dataset.card;if(dragging===null||dragging===dest)return;let a=clone(list(state.index)),moved=a.splice(dragging,1)[0];a.splice(dest,0,moved);updatePlan(state.index,a);dragging=null;render()}});
let exp=document.querySelector('[data-export]');if(exp)exp.onclick=()=>download('FORM_trainingsdaten_v5.json','application/json',JSON.stringify({version:5,records,plans,sex},null,2));let csv=document.querySelector('[data-csv]');if(csv)csv.onclick=()=>{let rows=[['Datum','Typ','Erledigt','Übung','Variante','Satz','Wdh./Sek.','Gewicht (kg)','Dauer','Energie','Schritte','Notiz']];for(let i=0;i<total;i++){let e=entry(i),a=list(i);if(!a.length)a=[{id:'',sets:[null]}];a.forEach(x=>(x.sets||[null]).forEach((v,j)=>rows.push([iso(i),dayType(i),e.complete?'Ja':'Nein',catalog[x.id]?.name||'',x.variant||'',j+1,v??'',x.weights?.[j]??'',e.duration||'',e.energy||'',e.steps||'',e.note||''])))}download('FORM_training.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n'))};
let imp=document.querySelector('#import');if(imp)imp.onchange=async()=>{try{let a=JSON.parse(await imp.files[0].text());if(!a.records||typeof a.records!=='object')throw Error('Ungültige Datei');if(!confirm('Aktuelle Daten durch Sicherung ersetzen?'))return;records=a.records;plans=a.plans||{};sex=a.sex||'female';save();render();alert('Sicherung importiert')}catch(e){alert('Import fehlgeschlagen: '+e.message)}};
}
let now=new Date(), ni=idx(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`);if(ni>=0&&ni<total)state.index=ni;render();
if ('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
