const focusPools={all:['squat','lunge','bridge','pushup','snow','hinge','deadbug','bird','sideplank','plank','wallslide','split','bearhold','calf','heeltilt'],legs:['squat','lunge','split','sidestep','calf','heeltoe','wall','hinge','bridge','singlebridge'],abs:['deadbug','bird','sideplank','plank','heeltilt','hollow','bearhold','bridge','snow'],upper:['pushup','wallpush','snow','wallslide','pronecobra','pike','diamond','bird','sideplank','bearhold'],lower:['squat','lunge','bridge','singlebridge','hinge','split','sidestep','wall','calf','heeltoe','deadbug']};
const movement={squat:'squat',lunge:'lunge',split:'lunge',sidestep:'lunge',wall:'squat',bridge:'bridge',singlebridge:'bridge',hinge:'hinge',calf:'calf',heeltoe:'calf',pushup:'push',wallpush:'push',diamond:'push',pike:'push',snow:'back',wallslide:'back',pronecobra:'back',superman:'back',deadbug:'core',heeltilt:'core',plank:'core',sideplank:'core',hollow:'core',bearhold:'core',bird:'core'};
function rand(){if(window.crypto?.getRandomValues){const arr=new Uint32Array(1);crypto.getRandomValues(arr);return arr[0]/4294967296}return Math.random()}
function sampleRandom(pool,picked,focus){let options=pool.filter(id=>!picked.includes(id));if(!options.length)return null;const used=Object.fromEntries(picked.map(id=>[movement[id]||id,true]));let seen={};picked.forEach(id=>(catalog[id]?.muscles||[]).forEach(m=>seen[m]=(seen[m]||0)+1));let scores=options.map(id=>{let mus=catalog[id].muscles||[],newMus=mus.filter(m=>!seen[m]).length;let duplicate=used[movement[id]]?3:0;let bias=focus==='all'?Math.max(0,2.4-Math.min(...mus.map(m=>seen[m]||0))):1;return Math.max(.2,1.2+newMus*1.65+bias-duplicate+(rand()*1.5))});let totalScore=scores.reduce((a,b)=>a+b,0),t=rand()*totalScore;return options.find((id,j)=>(t-=scores[j])<=0)||options.at(-1)}
function buildRandomSession(){let focus=state.randomFocus,duration=Number(state.randomDuration)||20,count=Math.min(10,Math.max(3,Number(state.randomCount)||5)),difficulty=state.randomDifficulty;const pool=focusPools[focus]||focusPools.all;let selected=[];if(focus==='all'){const lead=['squat','lunge','bridge','split','hinge'][Math.floor(rand()*5)];selected.push(lead)}while(selected.length<count){let id=sampleRandom(pool,selected,focus);if(!id)break;selected.push(id)}const setsCount=duration<=15?1:duration<=25?2:3;const items=selected.map(id=>({id,variant:difficulty==='easy'?'easy':difficulty==='hard'?'hard':'standard',sets:Array.from({length:setsCount},()=>null),weights:Array.from({length:setsCount},()=>null),done:[]}));const session={id:'r-'+Date.now()+'-'+Math.floor(rand()*1e6),date:nowIso(),createdAt:new Date().toISOString(),focus,duration,completed:false,exercises:items};randomSessions.push(session);state.randomActiveId=session.id;state.randomStage='plan';saveRandom();render()}

function randomHistory(id,beforeDate){return randomSessions.filter(s=>!beforeDate||s.date<=beforeDate).flatMap(session=>{let xs=session.exercises.filter(e=>e.id===id),lines=xs.flatMap(x=>(x.sets||[]).map((v,j)=>isVal(v)?({reps:Number(v),weight:isVal(x.weights?.[j])?Number(x.weights[j]):null}):null).filter(Boolean));if(!lines.length)return [];let maxKg=lines.some(v=>v.weight!==null&&v.weight>0)?Math.max(...lines.map(x=>x.weight||0)):null;return [{i:Math.max(0,Math.min(total-1,idx(session.date))),date:session.date,sort:session.createdAt||session.date,lines,weighted:maxKg!==null,maxKg,topReps:Math.max(...lines.map(x=>x.reps)),totalReps:lines.reduce((a,x)=>a+x.reps,0),volume:lines.reduce((a,x)=>a+x.reps*(x.weight||0),0),variant:xs[0].variant||'standard',complete:!!session.completed,randomId:session.id}]})}
function randomizer(){const rs=activeRandom();let intro=`<div class="app-heading"><div><h1>Zufallstraining</h1><p>Ein neuer Plan, abgestimmt auf deinen Fokus</p></div></div>`;
if(state.randomStage==='setup'||!rs){return intro+`<section class="random-lead"><span class="random-eyebrow">FORM. TRAINING GENERATOR</span><h2>Dein Training. Neu gemischt.</h2><p>Reines Körpergewicht, ohne Cardio-Zwang. Ausgewogene Übungen für dein Ziel und deine verfügbare Zeit.</p></section><div class="random-block"><h3>Trainingsfokus</h3><div class="focus-grid">${Object.entries(focusLabels).map(([v,n])=>`<button data-rfocus="${v}" class="focus-choice ${state.randomFocus===v?'selected':''}"><span>${{all:'✦',legs:'⌁',abs:'◉',upper:'⬆',lower:'⬇'}[v]}</span><b>${n}</b></button>`).join('')}</div><h3>Trainingsdauer</h3><div class="rchoice-row">${[10,15,20,30].map(v=>`<button class="${state.randomDuration===v?'selected':''}" data-rduration="${v}">${v} Min.</button>`).join('')}</div><h3>Anzahl der Übungen</h3><div class="rchoice-row">${[3,4,5,6,8].map(v=>`<button class="${state.randomCount===v?'selected':''}" data-rcount="${v}">${v}</button>`).join('')}</div><h3>Schwierigkeitsgrad</h3><div class="rchoice-row">${[['easy','Leicht'],['normal','Mittel'],['hard','Intensiv']].map(([v,n])=>`<button class="${state.randomDifficulty===v?'selected':''}" data-rdifficulty="${v}">${n}</button>`).join('')}</div><div class="random-note">Die Auswahl ist ein Trainingsvorschlag, kein medizinisch geprüfter Automatismus. Verwende nur Übungen, die du technisch beherrschst.</div><button class="btn random-generate" data-rgenerate>⤨ Training erstellen</button></div><div class="random-archive"><h3>Deine letzten Zufallstrainings</h3>${randomSessions.slice(-6).reverse().map(s=>`<button data-ropen="${esc(s.id)}"><span>${esc(s.date)} · ${esc(focusLabels[s.focus]||'Ganzkörper')}</span><b>${s.completed?'✓ Erledigt':s.exercises.length+' Übungen'} ›</b></button>`).join('')||'<p class="muted">Noch keine Zufallstrainings erstellt.</p>'}</div>`}
const idxSelected=Number(state.randomDetailIndex)||0;const exercise=rs.exercises[idxSelected];if(state.randomStage==='detail'&&exercise){const ex=catalog[exercise.id],history=loggedHistory(exercise.id).filter(h=>h.randomId!==rs.id),last=history.at(-1);return `<div class="detail-top"><button data-rback-plan class="circle-icon">‹</button><h1>${esc(ex.name)}</h1><button data-rhistory="${exercise.id}" class="circle-icon">◷</button></div><div class="random-context">${esc(focusLabels[rs.focus])} · Zufallstraining vom ${rs.date}</div><div class="last-session"><div class="eyebrow">LETZTES MAL</div><strong>${last?esc(lastSetSummary(last,exercise.id,3)):'Noch kein früherer Satz'}</strong><p>${last?esc(last.date):'Deine Historie beginnt mit dem ersten dokumentierten Satz.'}</p></div><div class="detail-section-title">Aktuelles Training <span>${exercise.sets.length} Sätze</span></div><div class="detail-set-head"><span>Satz</span><span>Gewicht kg</span><span>${setMetric(exercise.id)}</span><span>✓</span></div>${exercise.sets.map((v,j)=>`<div class="detail-set-row"><b>${j+1}</b><input type="number" min="0" step="0.5" inputmode="decimal" data-rweight="${j}" value="${esc(exercise.weights?.[j]??'')}" placeholder="–"><input type="number" min="0" inputmode="numeric" data-rset="${j}" value="${esc(v??'')}" placeholder="–"><button class="set-check ${exercise.done?.[j]?'checked':''}" data-rcheck="${j}">${exercise.done?.[j]?'✓':'○'}</button></div>`).join('')}<div class="detail-tools"><button data-raddset>＋ Satz hinzufügen</button><button data-rdelset>− Letzten Satz</button></div><div class="detail-options"><label>Schwierigkeit <select class="plaininput" data-rvariant><option value="easy" ${exercise.variant==='easy'?'selected':''}>Leichter: ${esc(ex.easy)}</option><option value="standard" ${exercise.variant==='standard'?'selected':''}>Standard</option><option value="hard" ${exercise.variant==='hard'?'selected':''}>Schwerer: ${esc(ex.hard)}</option></select></label></div><section class="detai return intro+`<div class="random-plan-head"><button data-rsetup>‹ Neu konfigurieren</button><span>${rs.completed?'✓ Abgeschlossen':'Plan editierbar'}</span></div><section class="random-plan-hero"><span class="random-eyebrow">${esc(focusLabels[rs.focus])}</span><h2>Dein Training</h2><p>${rs.exercises.length} Übungen · ca. ${rs.duration} Min. · Nur Körpergewicht</p></section><p class="muted small">Tippe eine Übung an, um Sätze und Gewichte zu tracken. Du kannst die Reihenfolge ändern und jederzeit Übungen hinzufügen.</p><div class="random-list">${rs.exercises.map((x,j)=>{let ex=catalog[x.id]||{name:x.id,target:'',muscles:[]},h=loggedHistory(x.id).filter(v=>v.randomId!==rs.id).at(-1);return `<div class="random-item" draggable="true" data-rdrag="${j}"><button class="random-main" data-rdetail="${j}">${miniIcon(x.id)}<span><b>${esc(ex.name)}</b><small>${x.sets.length} Sätze · ${esc(ex.target)}</small>${h?`<em>Zuletzt: ${esc(lastSetSummary(h,x.id,2))}</em>`:''}</span></button><div class="random-actions"><button aria-label="Übung nach oben" data-rmove="${j}:-1" ${j===0?'disabled':''}>↑</button><button aria-label="Übung nach unten" data-rmove="${j}:1" ${j===rs.exercises.length-1?'disabled':''}>↓</button><button aria-label="Übung entfernen" data-rremove="${j}">×</button></div></div>`}).join('')}</div><button class="full-add" data-radd>＋ Übung über Körperkarte hinzufügen</button><div class="random-plan-footer"><button class="btn" data-rcomplete>${rs.completed?'✓ Training abgeschlossen':'Training abschließen'}</button><button class="btn alt" data-rsetup>Neues Training erstellen</button></div>`}


function scanPage(){
 const q=(state.scanQuery||'').toLowerCase().trim();
 const words=q.split(/[^a-z0-9äöüß]+/).filter(x=>x.length>2);
 const ranked=Object.entries(catalog).map(([id,x])=>{
 const name=x.name.toLowerCase();const terms=(name+' '+id.replaceAll('_',' ')).toLowerCase();
 let score=words.reduce((n,w)=>n+(name.includes(w)?6:terms.includes(w)?2:0),0);
 return {id,x,score};
 }).sort((a,b)=>b.score-a.score||a.x.name.localeCompare(b.x.name,'de'));
 const matches=q?ranked.filter(x=>x.score>0):ranked.slice(0,12);
 const preview=state.scanPhoto?'<img class="scan-photo" src="'+state.scanPhoto+'" alt="Ausgewähltes Foto">':'<div class="scan-placeholder">📷<br>Foto aufnehmen oder auswählen</div>';
 return '<div class="app-heading"><div><h1>FORM. Scan</h1><p>Foto aufnehmen · Übung bestätigen · hinzufügen</p></div></div>'+
 '<div class="scan-panel">'+preview+
 '<label class="scan-file-label">Kamera / Fotomediathek öffnen<input id="scan-camera" type="file" accept="image/*" capture="environment"></label>'+
 '<p class="scan-notice"><strong>Hinweis:</strong> Diese Version analysiert keine Bildinhalte mit KI. Sie hilft dir, eine Übung anhand von Namen oder dem Dateinamen zu finden und vor dem Hinzufügen zu bestätigen. Das Foto bleibt auf deinem Gerät und wird nicht hochgeladen.</p>'+
 '<label class="scan-label">Welche Übung zeigt das Foto?<input id="scan-search" class="plaininput" type="search" placeholder="z. B. Kniebeuge, Dead Bug, Plank" value="'+esc(state.scanQuery||'')+'"></label>'+
 '<div class="scan-results">'+matches.slice(0,15).map(({id,x})=>'<button class="scan-result '+(state.scanCandidate===id?'chosen':'')+'" data-scan-select="'+esc(id)+'">'+miniIcon(id)+'<span><b>'+esc(x.name)+'</b><small>'+esc(x.target||'')+'</small></span><span>'+(state.scanCandidate===id?'✓':'›')+'</span></button>').join('')+(matches.length===0?'<p>Keine passende Übung gefunden. Versuche einen anderen Suchbegriff.</p>':'')+'</div>'+
 (state.scanCandidate&&catalog[state.scanCandidate]?'<div class="scan-confirm"><b>'+esc(catalog[state.scanCandidate].name)+'</b><p>'+esc(catalog[state.scanCandidate].tip||'')+'</p><p><b>Leichter:</b> '+esc(catalog[state.scanCandidate].easy||'')+'</p><p><b>Schwerer:</b> '+esc(catalog[state.scanCandidate].hard||'')+'</p><button class="btn" data-scan-add>✓ Bestätigen und zum Training hinzufügen</button></div>':'')+
 '<button class="btn alt" data-scan-back>Zurück</button></div>';
}

function isVal(v){return v!==null&&v!==undefined&&String(v).trim()!==''&&Number.isFinite(Number(v))&&Number(v)>=0}
function setMetric(id){return ['sideplank','plank','wall','hollow','pronecobra','bearhold'].includes(id)?'Sek.':'Wdh.'}
function loggedHistory(id,beforeIndex=total){
 let all=[];

document.querySelectorAll('[data-entry]').forEach(e=>e.onchange=()=>edit(state.index,{[e.dataset.entry]:e.value}));document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const e=entry(state.index),finished=b.type==='checkbox'?b.checked:!e.complete;const payload={complete:finished};if(finished){payload.completedExercises=clone(list(state.index));payload.completedAt=new Date().toISOString()}else{payload.completedExercises=null;payload.completedAt=null}edit(state.index,payload);render();if(finished&&['A','B'].includes(dayType(state.index))){const logged=payload.completedExercises.filter(x=>x.sets?.some(v=>v!==null&&v!==''&&v!==undefined)).length;const notice=document.createElement('div');notice.className='session-finished';notice.innerHTML='<b>✓ Training gespeichert</b><p>'+logged+' Übungen dokumentiert. Deine Ergebnisse sind in „Fortschritt“ sichtbar.</p><button type="button">Fortschritt ansehen</button>';document.getElementById('root').prepend(notice);notice.querySelector('button').onclick=()=>setView('stats')}});
document.querySelectorAll('[data-open-history]').forEach(b=>b.onclick=()=>openHistory(b.dataset.openHistory,state.view));let histBack=document.querySelector('[data-history-back]');if(histBack)histBack.onclick=()=>setView(state.historyFrom||'training');const histPick=document.querySelector('#history-pick');if(histPick)histPick.onchange=()=>{state.historyId=histPick.value;state.historyMetric='auto';render()};document.querySelectorAll('[data-hmetric]').forEach(b=>b.onclick=()=>{state.historyMetric=b.dataset.hmetric;render()});document.querySelectorAll('[data-history-day]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.historyDay);setView('training')});const histEmpty=document.querySelector('[data-history-empty]');if(histEmpty)histEmpty.onclick=()=>openHistory('squat','stats');
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [i,d]=b.dataset.move.split(':').map(Number),a=clone(list(state.index)),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];updatePlan(state.index,a);render()});
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));a.splice(+b.dataset.remove,1);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-variant]').forEach(e=>e.onchange=()=>{let a=clone(list(state.index));a[+e.dataset.variant].variant=e.value;updatePlan(state.index,a)});
document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));let ex=a[+b.dataset.addset];ex.sets.push(null);if(!Array.isArray(ex.weights))ex.weights=[];ex.weights.push(null);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.delset.split(':').map(Number),a=clone(list(state.index));if(a[i].sets.length<=1)return alert('Mindestens ein Satz bleibt erhalten.');a[i].sets.splice(j,1);if(Array.isArray(a[i].weights))a[i].weights.splice(j,1);if(Array.isArray(a[i].done))a[i].done.splice(j,1);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-set]').forEach(e=>e.onchange=()=>{let [i,j]=e.dataset.set.split(':').map(Number),a=clone(list(state.index));a[i].sets[j]=e.value===''?null:Number(e.value);updatePlan(state.index,a)});
document.querySelectorAll('[data-weight]').forEach(el=>el.onchange=()=>{let [i,j]=el.dataset.weight.split(':').map(Number),a=clone(list(state.index));if(!Array.isArray(a[i].weights))a[i].weights=[];const number=Number(el.value.replace(',','.'));a[i].weights[j]=el.value.trim()===''?null:(Number.isFinite(number)&&number>=0?number:null);updatePlan(state.index,a)});
let add=document.querySelector('[data-add]');if(add)add.onclick=()=>{state.adding=true;setView('body')};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(state.addingToRandom&&activeRandom()){modifyRandom(rs=>rs.exercises.push({id:b.dataset.pick,variant:'standard',sets:[null,null],weights:[null,null],done:[]}));state.adding=false;state.addingToRandom=false;state.randomStage='plan';setView('randomizer')}else{let a=clone(list(state.index));a.push({id:b.dataset.pick,variant:'standard',sets:[null,null]});updatePlan(state.index,a);state.adding=false;setView('training')}});document.querySelectorAll('[data-muscle]').forEach(b=>{const act=()=>{state.muscle=b.dataset.muscle;setView('body')};b.onclick=act;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{sex=b.dataset.sex;save();render()});let back=document.querySelector('[data-back]');if(back)back.onclick=()=>{state.adding=false;if(state.addingToRandom){state.addingToRandom=false;setView('randomizer')}else setView('training')};
let prop=document.querySelector('[data-propagate]');if(prop)prop.onclick=()=>{let type=dayType(state.index),src=clone(list(state.index)).map(x=>({id:x.id,variant:x.variant,sets:x.sets.map(()=>null),weights:x.sets.map(()=>null)})),count=0;for(let z=state.index+1;z<total;z++)if(dayType(z)===type&&!plans[iso(z)]){plans[iso(z)]=clone(src);count++}save();alert(`${count} zukünftige Trainingstage aktualisiert.`)};
let dragging=null;document.querySelectorAll('[data-card]').forEach(c=>{c.ondragstart=e=>{dragging=+c.dataset.card;e.dataTransfer.effectAllowed='move'};c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();let dest=+c.dataset.card;if(dragging===null||dragging===dest)return;let a=clone(list(state.index)),moved=a.splice(dragging,1)[0];a.splice(dest,0,moved);updatePlan(state.index,a);dragging=null;render()}});
let exp=document.querySelector('[data-export]');if(exp)exp.onclick=()=>download('FORM_trainingsdaten_v5.json','application/json',JSON.stringify({version:11,records,plans,sex,randomSessions},null,2));let csv=document.querySelector('[data-csv]');if(csv)csv.onclick=()=>{let rows=[['Datum','Typ','Erledigt','Übung','Variante','Satz','Wdh./Sek.','Gewicht (kg)','Dauer','Energie','Schritte','Notiz']];for(let i=0;i<total;i++){let e=entry(i),a=list(i);if(!a.length)a=[{id:'',sets:[null]}];a.forEach(x=>(x.sets||[null]).forEach((v,j)=>rows.push([iso(i),dayType(i),e.complete?'Ja':'Nein',catalog[x.id]?.name||'',x.variant||'',j+1,v??'',x.weights?.[j]??'',e.duration||'',e.energy||'',e.steps||'',e.note||''])))}randomSessions.forEach(rs=>rs.exercises.forEach(x=>(x.sets||[]).forEach((v,j)=>rows.push([rs.date,'Zufall: '+(focusLabels[rs.focus]||'Ganzkörper'),rs.completed?'Ja':'Nein',catalog[x.id]?.name||'',x.variant||'',j+1,v??'',x.weights?.[j]??'',rs.duration||'','','','']))));download('FORM_training.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n'))};
let imp=document.querySelector('#import');if(imp)imp.onchange=async()=>{try{let a=JSON.parse(await imp.files[0].text());if(!a.records||typeof a.records!=='object')throw Error('Ungültige Datei');if(!confirm('Aktuelle Daten durch Sicherung ersetzen?'))return;records=a.records;plans=a.plans||{};sex=a.sex||'female';if(Array.isArray(a.randomSessions)){randomSessions=a.randomSessions;saveRandom()}save();render();alert('Sicherung importiert')}catch(e){alert('Import fehlgeschlagen: '+e.message)}};
}
let now=new Date(), ni=idx(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`);if(ni>=0&&ni<total)state.index=ni;render();
if ('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script><script src="./form-upgrades-v18.js?v=18"></script><script src="./form-upgrades-v19.js?v=19"></script><script src="./form-anatomy-v20.js?v=20"></script><script src="./form-upgrades-v20.js?v=22"></script></body></html>
