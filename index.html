</style></head><body><header><div><div class="brand">FORM<span style="color:#51cab5">.</span></div><div class="subbrand">DEIN PERSÖNLICHER TRAININGSCOACH</div></div><nav><button data-view="training" class="active">Training</button><button data-view="calendar">6 Monate</button><button data-view="body">Körperkarte</button><button data-view="stats">Fortschritt</button><button data-view="reminders">Erinnerungen</button></nav></header><div id="storage-notice" hidden style="background:#fff0cc;color:#593c00;padding:12px 18px;text-align:center;font-weight:600">Achtung: Dieser Browser blockiert lokale Speicherung. Deine Eingaben gehen beim Schließen verloren. Bitte nutze den JSON-Export unter Fortschritt nach jeder Einheit oder öffne die Datei in einem anderen Browser.</div><main id="root"></main><script>
 'use strict';
const start=new Date(2026,10,2,12), total=182;
const key='form-coach-v5';

let reminders=reminderDefaults.map(x=>({...x}));try{const saved=JSON.parse(localStorage.getItem('form-pwa-reminders')||'null');if(Array.isArray(saved)&&saved.length===3){reminders=saved}}catch(e){}

function calendarEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function reminderCalendar(){let startDay=new Date(2026,10,2,12),endDay=new Date(2027,4,3,12);const pad=n=>String(n).padStart(2,'0');const stamp=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';const events=reminders.filter(r=>r.enabled).map(r=>{const d=new Date(startDay);d.setDate(d.getDate()+((r.day-d.getDay()+7)%7));const [h,m]=r.time.split(':').map(Number);d.setHours(h,m,0,0);const e=new Date(d.getTime()+r.duration*60000);return ['BEGIN:VEVENT','UID:form-'+r.day+'-20261102@local.form','DTSTAMP:20261028T120000Z','DTSTART;TZID=Europe/Vienna:'+stamp(d),'DTEND;TZID=Europe/Vienna:'+stamp(e),'RRULE:FREQ=WEEKLY;UNTIL=20270502T215959Z','SUMMARY:'+calendarEscape('FORM. '+r.name),'DESCRIPTION:'+calendarEscape('Dein wöchentlicher FORM.-Trainingstermin. Trainingsdaten bleiben in der FORM.-App.'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+calendarEscape('FORM. '+r.name),'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n')});if(!events.length){alert('Bitte mindestens eine Erinnerung aktivieren.');return}download('FORM_Trainingserinnerungen.ics','text/calendar;charset=utf-8',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FORM Training//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:FORM Training',...events,'END:VCALENDAR'].join('\r\n'))}
function reminderPage(){return heading('Trainingserinnerungen','Die Erinnerungen werden über den iPhone-Kalender eingerichtet, nicht als Push-Mitteilungen dieser Web-App.')+`<div class="card"><h2>Deine wöchentlichen Termine</h2><p class="muted">Die Zeiten kannst du ändern. Danach exportierst du eine Kalenderdatei mit wiederkehrenden Terminen vom 2. November 2026 bis Anfang Mai 2027.</p>${reminders.map((r,i)=>`<div class="controls" style="padding:12px 0;border-bottom:1px solid #e0e6eb;justify-content:space-between"><label><input type="checkbox" data-rem-enable="${i}" ${r.enabled?'checked':''}> ${r.day===1?'Montag':r.day===2?'Dienstag':'Donnerstag'} · ${r.name}</label><input class="plaininput" style="max-width:130px" type="time" data-rem-time="${i}" value="${r.time}" ${r.enabled?'':'disabled'}></div>`).join('')}<div style="height:14px"></div><button class="btn" data-rem-export>Kalendererinnerungen exportieren (.ics)</button><p class="small muted">Importiere die Datei in Apple Kalender und bestätige die Termine. Bitte nur einmal importieren, damit keine doppelten Erinnerungen entstehen. Nach Änderungen alte Termine entfernen, bevor du neu importierst. Eine PWA kann nicht ohne Push-Server automatisch eigene Benachrichtigungen schicken.</p></div><div class="card"><h2>Privatsphäre und Backups</h2><p>Trainingsdaten werden lokal gespeichert. Beim Löschen der App, Löschen der Website-Daten, Geräteverlust oder Browserwechsel können sie verloren gehen. Exportiere deshalb regelmäßig deine JSON-Sicherung unter Fortschritt.</p><p>Die Trainingsdateien werden von FORM. nicht an einen Server gesendet. Falls du Kalendertermine mit iCloud synchronisierst, gelten dafür die Einstellungen deines Apple-Kontos.</p><button class="btn alt" data-view="stats">Zu Fortschritt und Datensicherung</button></div>`}

sideplank:{name:'Side Plank',target:'15–30 Sek. je Seite',muscles:['abs','shoulders'],tip:'Ellbogen unter Schulter, Becken hochhalten, ruhig weiteratmen. Seiten separat zählen.',easy:'Seitstütz auf Knien',hard:'Seitstütz mit gestreckten Beinen, länger halten',link:'https://www.nhs.uk/live-well/exercise/strength-and-resistance/'}}
const muscleNames={abs:'Bauch & Core',legs:'Beine',glutes:'Gesäß',back:'Rücken',shoulders:'Schultern',chest:'Brust',arms:'Arme'};
const extra={plank:{name:'Plank',target:'20–40 Sekunden',muscles:['abs'],tip:'Unterarmstütz mit gespanntem Bauch und neutralem Rücken.',easy:'Knie aufsetzen',hard:'Langsamer Schulter-Tap',link:'https://www.acefitness.org/resources/everyone/exercise-library/'},calf:{name:'Wadenheben',target:'12–20',muscles:['legs'],tip:'Langsam auf die Zehenspitzen und wieder senken.',easy:'Mit Wand festhalten',hard:'Einbeinig',link:'https://www.acefitness.org/resources/everyone/exercise-library/'},bird:{name:'Bird Dog',target:'8–12 je Seite',muscles:['abs','back'],tip:'Vierfüßlerstand, diagonal Arm und Bein lang machen und ruhig halten.',easy:'Nur Arme oder Beine',hard:'3 Sekunden oben halten',link:'https://www.acefitness.org/resources/everyone/exercise-library/'},wall:{name:'Wall Sit',target:'20–45 Sekunden',muscles:['legs','glutes'],tip:'Mit Rücken an Wand sinken und stabil halten.',easy:'Weniger tief',hard:'Länger halten',link:'https://www.acefitness.org/resources/everyone/exercise-library/'},superman:{name:'Bauchlage Rückenheben',target:'8–12',muscles:['back'],tip:'In Bauchlage Brust leicht anheben, Hals neutral.',easy:'Nur Arme bewegen',hard:'Oben 2 Sekunden halten',link:'https://www.acefitness.org/resources/everyone/exercise-library/'},pike:{name:'Pike Push-ups',target:'5–10',muscles:['shoulders','arms'],tip:'Hüfte nach oben, Kopf zwischen die Hände in Richtung Boden senken.',easy:'Geringerer Bewegungsumfang',hard:'Füße leicht erhöht',link:'https://www.acefitness.org/resources/everyone/exercise-library/'},diamond:{name:'Enge erhöhte Liegestütze',target:'6–12',muscles:['chest','arms'],tip:'Hände enger auf stabiler Fläche, Ellenbogen kontrolliert nah am Körper.',easy:'Höhere Fläche',hard:'Niedrigere Fläche',link:'https://www.acefitness.org/resources/everyone/exercise-library/'}};

let records={},plans={},sex='female',storageOK=true;
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{localStorage.setItem('_formtest','ok');localStorage.removeItem('_formtest');let v=localStorage.getItem(key);if(v){let x=JSON.parse(v);records=x.records||{};plans=x.plans||{};sex=x.sex||'female';return}for(let k of oldKeys){let raw=localStorage.getItem(k);if(raw){let old=JSON.parse(raw);records=old.records||old;return}}}catch(e){storageOK=false}}
load();
let state={view:'training',index:0,muscle:'abs',adding:false};
function save(){try{localStorage.setItem(key,JSON.stringify({version:5,records,plans,sex}));storageOK=true}catch(e){storageOK=false}setStatus()}
function setStatus(){let t=document.querySelector('#storage-notice');if(t){t.hidden=storageOK;t.textContent='Speicherung ist hier blockiert. Bitte nach jeder Einheit unter „Fortschritt“ als JSON exportieren.'}}
function dt(i){let d=new Date(start);d.setDate(start.getDate()+i);return d}
function iso(i){let d=dt(i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function idx(s){const p=s.split('-').map(Number);return Math.round((new Date(p[0],p[1]-1,p[2],12)-start)/86400000)}
function dayType(i){return ['','A','K','','B','',''][dt(i).getDay()]||''}
function week(i){return Math.floor(i/7)+1}
function cyc(i){return Math.floor(i/7)%4+1}
function entry(i){return records[iso(i)]||{}}
function edit(i,part){records[iso(i)]={...entry(i),...part};save()}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function list(i){let type=dayType(i);if(!['A','B'].includes(type))return [];let p=plans[iso(i)];if(p)return p;return defaults[type].map(id=>({id,variant:'standard',sets:cyc(i)===1?[null]:[null,null]}))}

if(t==='A'||t==='B'){
 html+=`<div class="card"><div class="controls" style="justify-content:space-between"><h2 style="margin:0">Krafttraining ${t}</h2><span class="pill">15–20 Min. als Richtwert</span></div><p class="muted small">2 Min. mobilisieren · 20–30 Sek. Wechselpause · 60 Sek. Rundenpause · 2–3 Wiederholungen in Reserve</p><div class="hint">Du kannst Übungen per Ziehen sortieren, mit ↑ ↓ verschieben, entfernen oder über die Körperkarte hinzufügen. Jeder Übung kannst du beliebig viele Sätze geben.</div>`;
 html+=list(i).map((x,n)=>exercise(x,n,i)).join('');
 html+=`<button class="btn" data-add>+ Übung über Körperkarte hinzufügen</button><div class="spacer"></div><div class="twocol"><div><label>Trainingsdauer (Min.)</label><input class="plaininput" type="number" data-entry="duration" value="${esc(e.duration||'')}" min="0"></div><div><label>Energie (1–5)</label><select class="plaininput" data-entry="energy"><option value="">Auswählen</option>${[1,2,3,4,5].map(x=>`<option ${String(e.energy||'')===String(x)?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="spacer"></div><label>Notizen</label><textarea class="plaininput" data-entry="note">${esc(e.note||'')}</textarea><div class="spacer"></div><button class="btn" data-complete>${e.complete?'✓ Erledigt · rückgängig':'Training erledigt'}</button></div>`
}else if(t==='K')html+=`<div class="card"><h2>Kampfsport · 70 Minuten</h2><p>Mittlere Intensität. Keine zusätzliche Krafteinheit geplant.</p><label><input type="checkbox" data-complete ${e.complete?'checked':''}> Kurs besucht</label><textarea class="plaininput" data-entry="note" placeholder="Notizen">${esc(e.note||'')}</textarea></div>`;
else html+=`<div class="card"><h2>Erholung und Alltagsbewegung</h2><p>Spazierengehen und Mobility sind optional.</p><label>Schritte</label><input class="plaininput" type="number" data-entry="steps" min="0" value="${esc(e.steps||'')}"><div class="spacer"></div><label>Notizen</label><textarea class="plaininput" data-entry="note">${esc(e.note||'')}</textarea></div>`;
return html+`<p class="footer">Dein Plan beginnt am 02.11.2026 und endet am 02.05.2027. Änderungen gelten für den ausgewählten Tag; per „Plan übernehmen“ kannst du sie für künftige Trainingstage desselben Typs kopieren.</p>`+(t==='A'||t==='B'?`<div class="card"><button class="btn alt" data-propagate>Aktuelle Übungsreihenfolge auf zukünftige Trainingstage ${t} übertragen</button><p class="small muted">Überträgt die Übungen und deren Reihenfolge, aber nicht die bereits eingetragenen Sätze oder Wiederholungen. Bereits bearbeitete zukünftige Tage bleiben erhalten.</p></div>`:'')}
function exercise(x,n,i){let ex=catalog[x.id]||{name:x.id,target:'',tip:'',easy:'',hard:''};let sets=x.sets||[null,null];return `<div class="workout-card" draggable="true" data-card="${n}"><div class="workout-head"><span class="drag" title="Ziehen zum Sortieren" aria-hidden="true">⠿</span><h3>${n+1}. ${esc(ex.name)}</h3><button class="iconbtn" data-move="${n}:-1" aria-label="Übung nach oben">↑</button><button class="iconbtn" data-move="${n}:1" aria-label="Übung nach unten">↓</button><button class="iconbtn" data-remove="${n}" aria-label="Übung entfernen">×</button></div><div class="tiny">Ziel: ${esc(ex.target)} · ${esc((ex.muscles||[]).map(m=>muscleNames[m]).join(', '))}</div><p>${esc(ex.tip)}</p><div class="twocol"><div><label>Schwierigkeitsgrad</label><select class="plaininput" data-variant="${n}"><option value="easy" ${x.variant==='easy'?'selected':''}>Leichter: ${esc(ex.easy)}</option><option value="standard" ${x.variant==='standard'?'selected':''}>Standard</option><option value="hard" ${x.variant==='hard'?'selected':''}>Schwerer: ${esc(ex.hard)}</option></select></div><div><a href="${esc(ex.link||'#')}" target="_blank" rel="noopener noreferrer">Übungsanleitungen ansehen ↗</a></div></div><div class="spacer"></div><strong>Sätze</strong>${sets.map((val,j)=>`<div class="setrow"><span class="tiny">Satz ${j+1}</span><input inputmode="numeric" type="number" min="0" max="999" placeholder="Wdh. / Sek." value="${esc(val??'')}" data-set="${n}:${j}"><button class="iconbtn" data-delset="${n}:${j}" aria-label="Satz entfernen">×</button></div>`).join('')}<div class="setactions"><button data-addset="${n}">+ Satz hinzufügen</button></div></div>`}
function calendar(){return heading('6 Monate Training','Wähle einen Tag, um Übungen und Fortschritt zu bearbeiten.')+`<div class="twocol">${Array.from({length:7},(_,block)=>{let begin=block*28,upto=Math.min(total,begin+28);return `<div class="card"><h2>Monatszyklus ${block+1}</h2><div class="small muted">${iso(begin)} bis ${iso(upto-1)}</div><div class="daystrip" style="flex-wrap:wrap">${Array.from({length:upto-begin},(_,j)=>{let i=begin+j,t=dayType(i);return `<button data-day="${i}" class="${entry(i).complete?'done':''}">${dt(i).getDate()}.${dt(i).getMonth()+1}.<br><b>${t||'·'}</b></button>`}).join('')}</div></div>`}).join('')}</div>`}
const silhouette=(back)=>`<g class="outline"><ellipse cx="110" cy="35" rx="17" ry="22"/><path d="M103 56 L117 56 L121 72 L99 72Z"/><path d="M${sex==='female'?'81':'76'} 73 Q110 66 ${sex==='female'?'139':'144'} 73 Q151 105 144 133 Q138 163 145 182 L137 198 L83 198 L75 182 Q82 163 76 133 Q69 105 ${sex==='female'?'81':'76'} 73Z"/><path d="M78 79 Q60 86 53 114 L43 175 Q38 188 48 190 Q57 189 59 178 L75 116Z"/><path d="M142 79 Q160 86 167 114 L177 175 Q182 188 172 190 Q163 189 161 178 L145 116Z"/><path d="M83 196 L109 199 L105 310 L98 338 Q88 351 79 341 L78 332 L73 279Z"/><path d="M111 199 L137 196 L147 279 L142 332 L141 341 Q132 351 122 338 L115 310Z"/></g>`;
function shape(m,d){return `<path class="bodypart ${state.muscle===m?'chosen':''}" role="button" tabindex="0" data-muscle="${m}" aria-label="${esc(muscleNames[m])}" d="${d}"/>`}
function human(back){return `<svg viewBox="0 0 220 360" role="group" aria-label="${back?'Rückansicht':'Vorderansicht'}"><text class="figlabel" x="110" y="11" text-anchor="middle">${back?'RÜCKSEITE':'VORDERSEITE'}</text>${silhouette(back)}${back?`${shape('shoulders','M82 79 Q93 72 102 81 L94 98 L76 100Z M118 81 Q127 72 138 79 L144 100 L126 98Z')}${shape('back','M94 88 L110 99 L126 88 L140 123 L130 167 L110 155 L90 167 L80 123Z')}${shape('arms','M65 107 L78 115 L58 177 L46 174Z M142 115 L155 107 L174 174 L162 177Z')}${shape('glutes','M79 169 Q95 164 109 174 L109 204 L81 198Z M111 174 Q125 164 141 169 L139 198 L111 204Z')}${shape('legs','M82 204 L107 205 L102 305 L84 327 L77 291Z M113 205 L138 204 L143 291 L136 327 L118 305Z')}`:`${shape('shoulders','M79 78 Q92 70 101 81 L94 101 L74 100Z M119 81 Q128 70 141 78 L146 100 L126 101Z')}${shape('chest','M95 92 Q109 90 110 97 Q111 90 125 92 L136 121 L111 129 L84 121Z')}${shape('abs','M88 128 L110 133 L132 128 L128 171 L110 184 L92 171Z')}${shape('arms','M65 107 L78 115 L58 177 L46 174Z M142 115 L155 107 L174 174 L162 177Z')}${shape('legs','M83 205 L107 207 L101 305 L84 329 L77 288Z M113 207 L137 205 L143 288 L136 329 L119 305Z')}`}</svg>`}
function suggested(id,i){let used=getChosen(i);let counts={};used.forEach(x=>(catalog[x]?.muscles||[]).forEach(m=>counts[m]=(counts[m]||0)+1));let muscles=catalog[id]?.muscles||[];return muscles.some(m=>(counts[m]||0)===0)?'Ergänzt eine bisher wenig trainierte Muskelgruppe':muscles.some(m=>(counts[m]||0)===1)?'Ergänzt die vorhandene Belastung':'Passt als zusätzliche Übung, kann aber das Volumen erhöhen'}
function body(){let all=Object.entries(catalog).filter(([id,x])=>x.muscles.includes(state.muscle));let suggest=all.slice().sort((a,b)=>{let used=getChosen(state.index);return (used.includes(a[0])?1:0)-(used.includes(b[0])?1:0)});return heading(state.adding?'Übung hinzufügen':'Interaktive Körperkarte','Tippe einen Muskel an, um passende Übungen zu sehen.')+`<div class="muscle-layout"><div class="card figurebox"><div class="toolbar"><div class="seg"><button class="${sex==='female'?'active':''}" data-sex="female">Weiblich</button><button class="${sex==='male'?'active':''}" data-sex="male">Männlich</button></div></div><div class="figures">${human(false)}${human(true)}</div><p class="bodyhint">Orientierung am Stil deines Beispiels: schematische Umrisse mit einzelnen Muskelzonen. Keine medizinische Anatomiezeichnung.</p><div class="bodytags">${Object.entries(muscleNames).map(([id,name])=>`<button data-muscle="${id}" class="${id===state.muscle?'active':''}">${name}</button>`).join('')}</div></div><div class="card"><button class="btn alt" data-back>← Zurück zum Training</button><h2>${muscleNames[state.muscle]}</h2>${suggest.map(([id,x],n)=>`<div class="libraryitem"><h3>${esc(x.name)} ${!getChosen(state.index).includes(id)&&n===0?'<span class="pill">Vorschlag</span>':''}</h3><div class="tiny">${esc(x.target)} · ${esc(suggested(id,state.index))}</div><p>${esc(x.tip)}</p><div class="tiny"><b>Leichter:</b> ${esc(x.easy)} · <b>Schwerer:</b> ${esc(x.hard)}</div><a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">Anleitung ↗</a> ${state.adding?`<button class="btn" data-pick="${id}">+ Zum Training</button>`:''}</div>`).join('')}</div></div>`}
function progress(){let done=0,k=0;for(let i=0;i<total;i++){if(entry(i).complete){if(dayType(i)==='K')k++;if(['A','B'].includes(dayType(i)))done++}}return heading('Fortschritt & Datensicherung','Deine Daten bleiben in diesem Browser. Bitte regelmäßig exportieren.')+`<div class="card"><div class="summaryblocks"><div>Krafttraining<b>${done}/52</b></div><div>Kampfsport<b>${k}/26</b></div><div>Erfüllung<b>${Math.round(done/52*100)}%</b></div></div><p class="hint">Privat: Diese HTML-App verschickt keine Trainingsdaten an einen Server. Achtung: Browserdaten löschen, privater Modus oder ein anderer Browser können deine Einträge verschwinden lassen. Exportiere regelmäßig eine JSON-Sicherung und bewahre sie sicher auf. Eine unverschlüsselte Sicherungsdatei kann von jeder Person gelesen werden, die Zugriff darauf hat.</p><div class="toolbar"><button class="btn" data-export>JSON sichern</button><button class="btn alt" data-csv>CSV exportieren</button></div><label>JSON-Sicherung importieren</label><input id="import" type="file" accept=".json,application/json"><p class="status">Speicherstatus: ${storageOK?'Lokaler Browser-Speicher verfügbar':'Lokales Speichern blockiert'}</p></div>`}
function download(name,type,text){let b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function wire(){document.querySelectorAll('[data-rem-enable]').forEach(b=>b.onchange=()=>{reminders[+b.dataset.remEnable].enabled=b.checked;saveReminders();render()});document.querySelectorAll('[data-rem-time]').forEach(b=>b.onchange=()=>{reminders[+b.dataset.remTime].time=b.value;saveReminders()});const remExport=document.querySelector('[data-rem-export]');if(remExport)remExport.onclick=reminderCalendar;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.index=+b.dataset.day;setView('training')});let p=document.querySelector('[data-prev]'),n=document.querySelector('[data-next]');if(p)p.onclick=()=>{state.index=Math.max(0,state.index-1);render()};if(n)n.onclick=()=>{state.index=Math.min(total-1,state.index+1);render()};let date=document.querySelector('#datepick');if(date)date.onchange=()=>{let v=idx(date.value);if(v>=0&&v<total){state.index=v;render()}};
document.querySelectorAll('[data-entry]').forEach(e=>e.onchange=()=>edit(state.index,{[e.dataset.entry]:e.value}));document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{edit(state.index,{complete:b.type==='checkbox'?b.checked:!entry(state.index).complete});render()});
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [i,d]=b.dataset.move.split(':').map(Number),a=clone(list(state.index)),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];updatePlan(state.index,a);render()});
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));a.splice(+b.dataset.remove,1);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-variant]').forEach(e=>e.onchange=()=>{let a=clone(list(state.index));a[+e.dataset.variant].variant=e.value;updatePlan(state.index,a)});
document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));a[+b.dataset.addset].sets.push(null);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.delset.split(':').map(Number),a=clone(list(state.index));if(a[i].sets.length<=1)return alert('Mindestens ein Satz bleibt erhalten.');a[i].sets.splice(j,1);updatePlan(state.index,a);render()});
document.querySelectorAll('[data-set]').forEach(e=>e.onchange=()=>{let [i,j]=e.dataset.set.split(':').map(Number),a=clone(list(state.index));a[i].sets[j]=e.value===''?null:Number(e.value);updatePlan(state.index,a)});
let add=document.querySelector('[data-add]');if(add)add.onclick=()=>{state.adding=true;setView('body')};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let a=clone(list(state.index));a.push({id:b.dataset.pick,variant:'standard',sets:[null,null]});updatePlan(state.index,a);state.adding=false;setView('training')});document.querySelectorAll('[data-muscle]').forEach(b=>{const act=()=>{state.muscle=b.dataset.muscle;setView('body')};b.onclick=act;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{sex=b.dataset.sex;save();render()});let back=document.querySelector('[data-back]');if(back)back.onclick=()=>{state.adding=false;setView('training')};
let prop=document.querySelector('[data-propagate]');if(prop)prop.onclick=()=>{let type=dayType(state.index),src=clone(list(state.index)).map(x=>({id:x.id,variant:x.variant,sets:x.sets.map(()=>null)})),count=0;for(let z=state.index+1;z<total;z++)if(dayType(z)===type&&!plans[iso(z)]){plans[iso(z)]=clone(src);count++}save();alert(`${count} zukünftige Trainingstage aktualisiert.`)};
let dragging=null;document.querySelectorAll('[data-card]').forEach(c=>{c.ondragstart=e=>{dragging=+c.dataset.card;e.dataTransfer.effectAllowed='move'};c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();let dest=+c.dataset.card;if(dragging===null||dragging===dest)return;let a=clone(list(state.index)),moved=a.splice(dragging,1)[0];a.splice(dest,0,moved);updatePlan(state.index,a);dragging=null;render()}});
let exp=document.querySelector('[data-export]');if(exp)exp.onclick=()=>download('FORM_trainingsdaten_v5.json','application/json',JSON.stringify({version:5,records,plans,sex},null,2));let csv=document.querySelector('[data-csv]');if(csv)csv.onclick=()=>{let rows=[['Datum','Typ','Erledigt','Übung','Variante','Satz','Wert','Dauer','Energie','Schritte','Notiz']];for(let i=0;i<total;i++){let e=entry(i),a=list(i);if(!a.length)a=[{id:'',sets:[null]}];a.forEach(x=>(x.sets||[null]).forEach((v,j)=>rows.push([iso(i),dayType(i),e.complete?'Ja':'Nein',catalog[x.id]?.name||'',x.variant||'',j+1,v??'',e.duration||'',e.energy||'',e.steps||'',e.note||''])))}download('FORM_training.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n'))};
let imp=document.querySelector('#import');if(imp)imp.onchange=async()=>{try{let a=JSON.parse(await imp.files[0].text());if(!a.records||typeof a.records!=='object')throw Error('Ungültige Datei');if(!confirm('Aktuelle Daten durch Sicherung ersetzen?'))return;records=a.records;plans=a.plans||{};sex=a.sex||'female';save();render();alert('Sicherung importiert')}catch(e){alert('Import fehlgeschlagen: '+e.message)}};
}
let now=new Date(), ni=idx(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`);if(ni>=0&&ni<total)state.index=ni;render();
if ('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
